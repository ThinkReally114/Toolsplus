<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToolsPlus</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #F3F3F3;
      }
      html.theme-dark, html.theme-dark body {
        background-color: #202020;
      }
      #app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #666;
        font-size: 14px;
      }
      #app-error {
        display: none;
        padding: 20px;
        color: #c00;
        font-family: "Segoe UI", monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("toolsplus-theme");
          var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
          var resolved = mode;
          if (mode === "system") {
            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.add("theme-" + resolved);
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="app">
      <div id="app-loading">Loading ToolsPlus...</div>
      <div id="app-error"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
