 56→    <script>
 57→      (function () {
 58→        try {
 59→          var saved = localStorage.getItem("toolsplus-theme");
 60→          var mode = saved === "light" || saved === "dark" || saved === "system" ? saved : "system";
 61→          var resolved = mode;
 62→          if (mode === "system") {
 63→            resolved = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
 64→          }
 65→          document.documentElement.classList.add("theme-" + resolved);
 66→          document.documentElement.setAttribute("data-theme", resolved);
 67→        } catch (e) {}
 68→      })();
 69→
 70→      // 诊断面板：应用卡死时按 F12 显示
 71→      (function () {
 72→        var diagEl = null;
 73→        function ensureDiag() {
 74→          if (diagEl) return diagEl;
 75→          diagEl = document.createElement("div");
 76→          diagEl.id = "app-diag";
 77→          document.body.appendChild(diagEl);
 78→          return diagEl;
 79→        }
 80→        function dumpDiag() {
 81→          var el = ensureDiag();
 82→          var d = window.__TOOLSPLUS_DIAG__;
 83→          if (!d) {
 84→            el.textContent = "diag not yet initialized (main.ts not loaded?)";
 85→            el.classList.add("visible");
 86→            return;
 87→          }
 88→          el.textContent =
 89→            "=== ToolsPlus Diagnostic ===\n" +
 90→            "webview2: " + d.webview2Version + "\n" +
 91→            "tauriOk: " + d.tauriOk + "\n" +
 92→            "bootMs: " + Math.round(performance.now() - d.t0) + "ms\n" +
 93→            "--- log ---\n" +
 94→            d.errors.join("\n");
 95→          el.classList.add("visible");
 96→        }
 97→        window.addEventListener("keydown", function (e) {
 98→          if (e.key === "F12") {
 99→            e.preventDefault();
100→            dumpDiag();
101→          }
102→        });
103→        // 10 秒后如果 main.ts 还没加载，自动显示诊断
104→        setTimeout(function () {
105→          var app = document.getElementById("app");
106→          if (app && app.textContent && app.textContent.indexOf("Loading") !== -1) {
107→            dumpDiag();
108→          }
109→        }, 10000);
110→      })();
111→    </script>
