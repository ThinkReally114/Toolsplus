name: Build Single EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify frontend dist
        shell: pwsh
        run: |
          $distPath = Join-Path $env:GITHUB_WORKSPACE "dist"
          if (Test-Path $distPath) {
            Write-Host "=== dist/ contents ==="
            Get-ChildItem $distPath -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize
            $indexFile = Join-Path $distPath "index.html"
            if (Test-Path $indexFile) {
              Write-Host "=== index.html first 500 chars ==="
              Get-Content $indexFile -TotalCount 30
            } else {
              Write-Host "ERROR: index.html not found in dist/"
            }
          } else {
            Write-Host "ERROR: dist/ directory not found"
          }

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolsplus-dist
          path: dist/
          retention-days: 3

      - name: Build Tauri (raw EXE)
        run: npm run tauri build -- --no-bundle

      - name: Build Tauri installers (NSIS/MSI)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri build

      - name: Find built artifacts
        id: find
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release"
          $exe = Get-ChildItem -Path $exePath -Filter "*.exe" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'nsis|setup' } | Select-Object -First 1 -ExpandProperty FullName
          $nsisPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/nsis"
          $nsis = Get-ChildItem -Path $nsisPath -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          $msiPath = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle/msi"
          $msi = Get-ChildItem -Path $msiPath -Filter "*.msi" -File -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

          if ($exe) { "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          if ($nsis) { "nsis=$nsis" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          if ($msi) { "msi=$msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          Write-Host "exe=$exe"
          Write-Host "nsis=$nsis"
          Write-Host "msi=$msi"

      - name: Upload EXE artifact
        if: steps.find.outputs.exe
        uses: actions/upload-artifact@v4
        with:
          name: toolsplus-exe
          path: ${{ steps.find.outputs.exe }}
          retention-days: 7

      - name: Upload NSIS installer
        if: steps.find.outputs.nsis
        uses: actions/upload-artifact@v4
        with:
          name: toolsplus-installer
          path: ${{ steps.find.outputs.nsis }}
          retention-days: 7

      - name: Upload MSI installer
        if: steps.find.outputs.msi
        uses: actions/upload-artifact@v4
        with:
          name: toolsplus-msi
          path: ${{ steps.find.outputs.msi }}
          retention-days: 7